[package]
name = "agentos-computer"
description = "Screen, mouse and keyboard control for AgentOS, scoped to the application in front."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
agentos-core.workspace = true
agentos-permissions.workspace = true
agentos-tools.workspace = true
async-trait.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

# The backends. Only macOS and Windows have one; elsewhere the crate still
# compiles and every tool refuses, so the authorisation logic above it is
# testable on every platform and Linux needs none of these system libraries.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
enigo = { version = "0.6.1", default-features = false }
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
macos-accessibility-client = "0.0.2"

[dev-dependencies]
agentos-audit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
