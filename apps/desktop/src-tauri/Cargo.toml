[package]
name = "agentos-desktop"
description = "The AgentOS desktop application: a client of agentos-runtime, holding no agent logic of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "agentos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
agentos-audit.workspace = true
agentos-browser.workspace = true
agentos-core.workspace = true
agentos-permissions.workspace = true
agentos-persistence.workspace = true
agentos-providers.workspace = true
agentos-runtime.workspace = true
agentos-secrets.workspace = true
agentos-tools.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = "12.0.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
