[workspace]
resolver = "3"
members = ["crates/agentos-core", "crates/agentos-permissions", "crates/agentos-secrets", "crates/agentos-audit", "crates/agentos-persistence", "crates/agentos-tools", "crates/agentos-providers", "crates/agentos-runtime", "crates/agentos-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/anpl1623/AgentOS"
authors = ["AgentOS Contributors"]

[workspace.dependencies]
agentos-core = { path = "crates/agentos-core", version = "0.1.0" }
agentos-secrets = { path = "crates/agentos-secrets", version = "0.1.0" }
agentos-persistence = { path = "crates/agentos-persistence", version = "0.1.0" }
agentos-audit = { path = "crates/agentos-audit", version = "0.1.0" }
agentos-permissions = { path = "crates/agentos-permissions", version = "0.1.0" }
agentos-tools = { path = "crates/agentos-tools", version = "0.1.0" }
agentos-providers = { path = "crates/agentos-providers", version = "0.1.0" }
agentos-runtime = { path = "crates/agentos-runtime", version = "0.1.0" }

anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
futures = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util", "sync", "signal"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }

tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
